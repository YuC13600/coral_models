# E3-01b: Same Area Negatives (area_ratio=0.75)
# 基準：dinov2_vitb_tune_02_4ph (84.3%)
# 策略：AreaAwareSampler，每 batch 75% 同區域 + 25% 跨區域（更強 hard negatives）
name: e3_01b_same_area_neg_075
seed: 42
device: cuda
output_dir: outputs

backbone:
  name: timm
  variant: vit_base_patch14_dinov2
  pretrained: true
  freeze: true
  output_dim: 768
  img_size: 518

head:
  name: mlp
  input_dim: 768
  hidden_dim: 1024
  output_dim: 1280
  dropout: 0.3
  use_batchnorm: true

loss:
  name: triplet
  margin: 0.3
  mining_strategy: hard

data:
  root_dirs:
  - /home/yuc/code/data/coral
  use_whole_image: true
  same_area_negatives: true
  area_ratio: 0.75
  image_size: 518
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  num_workers: 4

training:
  batch_size: 16
  accumulation_steps: 8
  learning_rate: 0.0003
  weight_decay: 0.0001
  early_stopping_patience: 6
  early_stopping_delta: 0.0005
  scheduler_patience: 3
  scheduler_factor: 0.5
  min_lr: 1.0e-06
  gradient_clip_norm: 1.0

phases:
- name: 'Phase 1: Head Only'
  epochs: 20
  learning_rate: 3.0e-04
  unfreeze_backbone: false
  unfreeze_layers: 0
- name: 'Phase 2: Head + Last 2 Blocks'
  epochs: 15
  learning_rate: 8.0e-05
  unfreeze_backbone: true
  unfreeze_layers: 2
- name: 'Phase 3: Head + Last 4 Blocks'
  epochs: 12
  learning_rate: 3.0e-05
  unfreeze_backbone: true
  unfreeze_layers: 4
- name: 'Phase 4: Head + Last 6 Blocks (LR=1e-5)'
  epochs: 15
  learning_rate: 1.0e-05
  unfreeze_backbone: true
  unfreeze_layers: 6
